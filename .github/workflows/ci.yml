name: CI for Selenium Tests

on:
  push:
    branches:
      - main  # Triggers the workflow when changes are pushed to the main branch

jobs:
  test:
    runs-on: ubuntu-latest  # Use Ubuntu runner for workflow

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3  # Check out repository code

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Chrome and ChromeDriver
      run: |
        set -e  # Exit on error to make issues visible in logs
    
        # Update package lists and install prerequisites
        echo "Updating package lists..."
        sudo apt-get update -y
        sudo apt-get install -y wget unzip apt-transport-https || { echo "Failed to install prerequisites"; exit 1; }
    
        # Download Google Chrome .deb file
        echo "Downloading Google Chrome..."
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb || { echo "Failed to download Google Chrome"; exit 1; }
    
        # Install Google Chrome
        echo "Installing Google Chrome..."
        sudo dpkg -i google-chrome-stable_current_amd64.deb || { echo "dpkg encountered an issue, attempting to fix..."; sudo apt-get -f install -y; }
    
        # Verify Chrome installation
        echo "Verifying Google Chrome installation..."
        google-chrome --version || { echo "Google Chrome installation failed"; exit 1; }
    
        # Get installed Chrome version
        CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
        echo "Installed Chrome version: $CHROME_VERSION"
    
        # Fetch and install the appropriate ChromeDriver version
        echo "Downloading ChromeDriver for Chrome version $CHROME_VERSION..."
        CHROMEDRIVER_VERSION=$(wget -qO- "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION")
        if [ -z "$CHROMEDRIVER_VERSION" ]; then
          echo "Failed to fetch ChromeDriver version for Chrome $CHROME_VERSION"
          exit 1
        fi
        wget "https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip" || { echo "Failed to download ChromeDriver"; exit 1; }
        unzip chromedriver_linux64.zip || { echo "Failed to unzip ChromeDriver"; exit 1; }
        sudo mv chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver
    
        # Verify ChromeDriver installation
        echo "Verifying ChromeDriver installation..."
        chromedriver --version || { echo "ChromeDriver installation failed"; exit 1; }
      shell: bash

    - name: Create test_data.json
      run: |
        echo "${{ secrets.TEST_DATA }}" | base64 --decode > utils/test_data.json

    - name: Run Tests and Generate Report
      run: |
        export PYTHONPATH="$PWD:$PYTHONPATH"
        pytest tests/ --junitxml=report.xml --disable-warnings  # Generate a JUnit-style test report

    - name: Upload Test Report
      uses: actions/upload-artifact@v3
      with:
        name: test-report
        path: report.xml
